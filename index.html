<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍞 Cardápio - Padaria Recamonde</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#F19720,#fef7f1); }
    .card{border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.1);}
    .form-check{background:#fff;padding:10px 12px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.05);}
    .form-check:hover{background-color:#fff8f1;}
    .section-title{border-bottom:2px solid #F19720;padding-bottom:5px;color:#1d3557;margin-top:25px;}
    .quantidade{width:80px;display:inline-block;margin-left:10px;}
    .botao{padding:12px 24px;border-radius:50px;text-decoration:none;color:white;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background-color .3s,transform .2s;box-shadow:0 4px 10px rgba(0,0,0,.2);}
    .botao:hover{transform:scale(1.05);box-shadow:0 6px 14px rgba(0,0,0,.3);}
    .whatsapp{background-color:#25D366;}
    .whatsapp:hover{background-color:#1ebe57;}
    .instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
    .whatsapp-button{position:fixed;bottom:20px;right:20px;z-index:9999;background-color:#25D366;padding:12px;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.3);}
    .price{font-weight:600;color:#1d3557;}
    .ing-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
    
    .ing-list .form-check{
        box-shadow:none;
        padding:4px 8px;
        margin: 6px 14px 10px 0;
        display:inline-flex;
        align-items:center;
        border: 1px solid #eee;
        border-radius: 8px;
        background: #fffdf9;
        transition: 0.2s;
    }
    .ing-list .form-check:hover{
        background: #fff6e8;
    }

  </style>
</head>
<body>
  <div class="container py-4">
    <div class="card p-4">
      <h1 class="text-center text-danger mb-3">🍞 Padaria Recamonde</h1>
      <p class="text-center text-muted mb-4">Selecione os itens, ajuste a quantidade e envie pelo WhatsApp.</p>

      <div id="menu"></div>

      <div class="mt-4">
        <label for="nome" class="form-label">Seu nome:</label>
        <input id="nome" type="text" class="form-control" placeholder="Digite seu nome" required>
      </div>
      <div class="mt-3">
        <label for="observacoes" class="form-label">Observações:</label>
        <textarea id="observacoes" class="form-control" placeholder="Ex.: sem cebola, bem passado..." rows="2"></textarea>
      </div>

      <div class="text-center mt-4">
        <button id="btnWhats" type="button" class="botao whatsapp me-2">📲 Enviar Pedido</button>
        <a href="https://www.instagram.com" target="_blank" class="botao instagram">📸 Instagram</a>
      </div>
      <div class="text-center mt-3 text-muted" id="totalBox" style="display:none;">
        <small>Total parcial: <strong id="totalSpan"></strong></small>
      </div>

      <a href="#" id="btnWhatsFloat" class="whatsapp-button" title="Fazer pedido no WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="40">
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded",()=>{
    const NUMERO_WHATSAPP='5585988608359';

    const MENU=[
      {categoria:'🥪 Lanches',itens:[
        {id:'001',nome:'X-Burguer',preco:12,ingredientes:['Pão brioche ','blend 140g ','queijo cheddar ','maionese da casa ','molho especial ']},
        {id:'002',nome:'X-Salada',preco:14,ingredientes:['Pão brioche ','blend 140g ','queijo muçarela ','alface americana ','tomate ','cebola roxa ','molho especial ']},
        {id:'003',nome:'X-Bacon',preco:16,ingredientes:['Pão brioche ','blend 140g ','queijo cheddar ','tiras de bacon ','maionese da casa ','molho barbecue ']},
        {id:'004',nome:'X-Tudo',preco:20,ingredientes:['Pão brioche ','2x blend 140g ','duplo cheddar ','picles ','cebola caramelizada ','maionese da casa ']}
      ]},
      {categoria:'🍟 Porções',itens:[
        {id:'101',nome:'Batata Frita (P)',preco:10,ingredientes:['Batata palito','sal']},
        {id:'102',nome:'Batata Frita (M)',preco:15,ingredientes:['Batata palito','sal']}
      ]},
      {categoria:'🥤 Bebidas',itens:[
        {id:'201',nome:'Coca-Cola Lata',preco:6,ingredientes:['Refrigerante 350ml']},
        {id:'202',nome:'Guaraná Lata',preco:5,ingredientes:['Refrigerante 350ml']}
      ]}
    ];

    const wrap=document.getElementById("menu");
    const formatBRL=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

    function render(){
      wrap.innerHTML='';
      MENU.forEach((cat,ci)=>{
        const h=document.createElement('h3');
        h.className='section-title';
        h.textContent=cat.categoria;
        wrap.appendChild(h);

        cat.itens.forEach((it,ii)=>{
          const id=`i-${ci}-${ii}`;
          const div=document.createElement('div');
          div.className='form-check';
          div.innerHTML=`
            <input class="form-check-input" type="checkbox" id="${id}" data-preco="${it.preco}" data-nome="${it.nome}" data-codigo="${it.id}">
            <label class="form-check-label" for="${id}">${it.id} - ${it.nome} (${formatBRL(it.preco)})</label>
            <input id="qtd-${id}" type="number" value="1" min="1" class="form-control quantidade">
            <a class="btn btn-link btn-sm p-0 ms-2" data-bs-toggle="collapse" href="#ing-${id}">Personalizar</a>
            <div class="collapse mt-2" id="ing-${id}">
              <div class="ing-actions mb-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-act="marcar" data-target="${id}">Marcar todos</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-act="desmarcar" data-target="${id}">Desmarcar todos</button>
              </div>
              <div class="ing-list" data-for="${id}">
                ${it.ingredientes.map((ing,k)=>`
                  <div class="form-check form-check-inline me-3">
                    <input class="form-check-input ing-cb" type="checkbox" id="ing-${id}-${k}" checked data-nome="${ing}">
                    <label class="form-check-label" for="ing-${id}-${k}">${ing}</label>
                  </div>`).join('')}
              </div>
            </div>`;
          wrap.appendChild(div);
        });
      });
      attachEvents();
    }

    function attachEvents(){
      document.querySelectorAll('#menu input[type=checkbox]').forEach(cb=>{
        cb.addEventListener('change',updateTotal);
      });
      document.querySelectorAll('#menu .quantidade').forEach(inp=>{
        inp.addEventListener('input',updateTotal);
      });
      document.querySelectorAll('.ing-actions [data-act]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const tgt=btn.dataset.target;
          const list=document.querySelector(`.ing-list[data-for="${tgt}"]`);
          if(!list)return;
          const marcar=btn.dataset.act==='marcar';
          list.querySelectorAll('.ing-cb').forEach(cb=>cb.checked=marcar);
        });
      });
    }

    function updateTotal(){
      let total=0;
      document.querySelectorAll('#menu input[type=checkbox]:checked').forEach(cb=>{
        const qtdInput=document.getElementById('qtd-'+cb.id);
        if(!qtdInput)return; // evita erro
        const qtd=parseInt(qtdInput.value)||1;
        const preco=parseFloat(cb.dataset.preco)||0;
        total+=qtd*preco;
      });
      const box=document.getElementById('totalBox');
      const span=document.getElementById('totalSpan');
      if(total>0){ box.style.display='block'; span.textContent=formatBRL(total);}
      else{ box.style.display='none'; span.textContent='';}
    }

    function montarMensagem(){
      const nome=document.getElementById('nome').value.trim();
      const obs=document.getElementById('observacoes').value.trim();
      if(!nome){alert('Digite seu nome!');return null;}
      const sel=document.querySelectorAll('#menu input[type=checkbox]:checked');
      if(sel.length===0){alert('Selecione pelo menos um item!');return null;}
      let msg=`🍞 *Pedido de ${nome}*\\n\\n`,total=0;
      sel.forEach(cb=>{
        const qtdInput=document.getElementById('qtd-'+cb.id);
        if(!qtdInput)return;
        const qtd=parseInt(qtdInput.value)||1;
        const preco=parseFloat(cb.dataset.preco)||0;
        const row=cb.closest('.form-check');
        const sem=Array.from(row.querySelectorAll('.ing-cb:not(:checked)')).map(x=>x.dataset.nome);
        const subtotal=qtd*preco; total+=subtotal;
        msg+=`✅ ${qtd}x ${cb.dataset.codigo} - ${cb.dataset.nome} — ${formatBRL(subtotal)}\\n`;
        if(sem.length) msg+=`   · *Sem:* ${sem.join(', ')}\\n`;
      });
      msg+=`\\n💰 *Total:* ${formatBRL(total)}`;
      if(obs) msg+=`\\n📝 *Obs:* ${obs}`;
      return msg;
    }

    function enviarPedido(){
      const m=montarMensagem();
      if(!m)return;
      const url=`https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=${encodeURIComponent(m)}`;
      window.open(url,'_blank');
    }

    document.getElementById('btnWhats').onclick=enviarPedido;
    document.getElementById('btnWhatsFloat').onclick=(e)=>{e.preventDefault();enviarPedido();};

    render();
  });
  </script>
</body>
</html>
